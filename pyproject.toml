[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ggufkit"
version = "0.2.0"
description = "Fingerprint, verify and visualize GGUF models: order-independent content hashes, provenance manifests and tensor images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Konstantin Perikov" }]
keywords = [
    "gguf",
    "ggml",
    "llama.cpp",
    "llm",
    "quantization",
    "fingerprint",
    "provenance",
    "supply-chain",
    "in-toto",
    "sigstore",
    "model-signing",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    # The fingerprint reads gguf-py's parsed fields; raise this cap only after the golden tests pass.
    "gguf>=0.19,<0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
viz = ["pillow>=10"]

[project.scripts]
ggufkit = "ggufkit.cli:entry"

[project.urls]
Homepage = "https://github.com/MysterionRise/ggufkit"
Repository = "https://github.com/MysterionRise/ggufkit"
Issues = "https://github.com/MysterionRise/ggufkit/issues"
Changelog = "https://github.com/MysterionRise/ggufkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MysterionRise/ggufkit/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.13",
    "pillow>=10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ggufkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ggufkit",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "CITATION.cff",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # missing docstrings: not every helper needs one
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # the formatter owns line length
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "T201",    # print is the CLI's output channel
    "C901",    # complexity thresholds are not useful for CLI wiring
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004", # magic numbers in byte-format code are the format
    "EM101",
    "EM102",
    "TRY003",
    "ANN401",  # Any is fine at the gguf boundary
    "FBT001",  # boolean flags are the natural CLI surface
    "FBT002",
    "ERA001",
    "CPY",     # no per-file copyright headers; LICENSE covers the project
    "PYI034",  # __enter__ -> Self needs typing_extensions on 3.10
    "PLC0415", # optional dependencies are imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001", "ANN", "PLR", "SLF001", "ARG001", "D", "TC"]
"scripts/**" = ["INP001", "T201", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["ggufkit"]

[tool.mypy]
python_version = "3.11"
packages = ["ggufkit"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:ggufkit"]

[tool.coverage.run]
source = ["ggufkit"]
